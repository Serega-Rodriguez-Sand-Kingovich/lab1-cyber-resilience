<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ЛР №4 — защищённый классификатор цифр</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
<main class="layout">
  <header>
    <p class="eyebrow">ИТМО · Киберустойчивость систем ИИ · ЛР №4</p>
    <h1>Распознавание рукописных цифр</h1>

    <div class="pill-row"><span id="health" class="pill">Проверка сервиса…</span></div>
  </header>
  <div class="columns">
    <section class="panel">
      <h2>Изображение 8×8</h2>

      <div id="pixels" class="pixels" aria-label="Сетка цифры 8 на 8"></div>
      <div class="controls">
        <select id="sample" class="secondary" aria-label="Выбор цифры">

          <option value="0">0</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
        </select>
        <button id="clear" type="button" class="secondary">Очистить</button>
      </div>
      <label for="token">API-токен</label>
      <input id="token" type="password" placeholder="Введите токен" autocomplete="off" spellcheck="false">
      <button id="send" type="button" class="primary">Распознать цифру</button>
    </section>
    <section class="panel results">
      <h2>Результат</h2>
      <p id="status" role="status" aria-live="polite">Введите токен и нажмите кнопку.</p>
      <div class="prediction"><span class="muted">Предсказанная цифра</span><strong id="digit">—</strong></div>
      <dl><dt>Версия модели</dt><dd id="version">—</dd><dt>Идентификатор запроса</dt><dd id="request-id">—</dd></dl>
      <h3>Отображаемые значения</h3>
      <p class="minor"> </p>
      <pre id="json-preview"></pre>
    </section>
  </div>
  <footer> </footer>
</main>
</body>
</html>
